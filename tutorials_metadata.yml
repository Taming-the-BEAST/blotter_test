# Central fallback metadata for tutorials that haven't migrated their own
# frontmatter yet (see MIGRATION_PLAN.md, task 1).
#
# Every tutorial's own README.md frontmatter is the source of truth. This
# file only fills in fields a tutorial does not define itself. Once a
# tutorial defines a field upstream, `generate-tutorial-data.rb` will
# print a build warning suggesting to remove the field here.
#
# Keyed by the same "owner/repo" string used in the `tutorials:` list in
# _config.yml.
#
# Supported fields (mirrors tutorials/tutorial_schema.yml):
#   beastversion_tutorial   - BEAST2 version the tutorial was written/tested with
#   workflow                - one of tutorial_schema.yml's `workflows`
#   status                  - one of tutorial_schema.yml's `status_values`
#   keywords                - list, 3-10 entries recommended
#   packages                - list of BEAST2 package names
#   domains                 - list of application domains
#   beastversion_package    - most recent BEAST2 version supporting the packages
#
# ---------------------------------------------------------------------------
# SEEDED, UNREVIEWED — generated 2026-07-21 by running _scripts/migrate_tutorial.py
# (regex/CBAN heuristics) read-only against every tutorial in _config.yml.
# `beastversion_tutorial` (renamed from each README's own `beastversion`) and
# `beastversion_package` (CBAN lookup) are trustworthy. `workflow`, `keywords`,
# and `domains` are crude keyword-matching guesses and need a human pass:
#
#   - `workflow` in particular is nearly useless as seeded — the heuristic
#     matched "Getting started" for 33 of 35 tutorials (its pattern is
#     `introduction|getting started|install|setup|first`, which nearly every
#     tutorial's setup instructions trip). Re-classify each one by hand against
#     tutorial_schema.yml's `workflows` list before relying on it.
#   - `domains` frequently misfires too (e.g. "speciation" from incidental
#     "species" mentions).
#   - `packages` is a fixed small pattern list (BDSKY/MASCOT/MultiTypeTree/
#     StarBeast*/SCOTTI/SA only) — packages outside that list are never
#     detected and must be added manually.
#
# Treat every entry below as a first draft, not ground truth.
# ---------------------------------------------------------------------------


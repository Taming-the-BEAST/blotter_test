# Central fallback metadata for tutorials that haven't migrated their own
# frontmatter yet (see MIGRATION_PLAN.md, task 1).
#
# Every tutorial's own README.md frontmatter is the source of truth. This
# file only fills in fields a tutorial does not define itself. Once a
# tutorial defines a field upstream, `generate-tutorial-data.rb` will
# print a build warning suggesting to remove the field here.
#
# Keyed by the same "owner/repo" string used in the `tutorials:` list in
# _config.yml.
#
# Supported fields (mirrors tutorials/tutorial_schema.yml):
#   beastversion_tutorial   - BEAST2 version the tutorial was written/tested with
#   workflow                - one of tutorial_schema.yml's `workflows`
#   status                  - one of tutorial_schema.yml's `status_values`
#   keywords                - list, 3-10 entries recommended
#   packages                - list of BEAST2 package names
#   domains                 - list of application domains
#   beastversion_package    - most recent BEAST2 version supporting the packages
#
# ---------------------------------------------------------------------------
# STATUS (2026-07-22):
#   - `workflow`, `keywords`, `domains` — human-reviewed against each tutorial's
#     README content (replacing the earlier `migrate_tutorial.py` heuristic guess).
#     `domains` values are constrained to tutorial_schema.yml's list (virology,
#     epidemiology, phylogeography, palaeontology, population genetics, language
#     evolution, macroevolution); methods-only tutorials with no natural domain
#     have `domains` omitted rather than forced. Some keywords are intentionally
#     outside the recommended taxonomy (e.g. "recombination", "nested sampling")
#     where they are the tutorial's actual subject — these trip a build warning
#     but are more useful for search than a forced taxonomy term.
#   - `packages` — still the raw heuristic seed, NOT yet reviewed (see MIGRATION_PLAN
#     task 5). Some are wrong (e.g. detected StarBeast2 where the tutorial uses a
#     different package). To be curated in a later pass.
#   - `beastversion_tutorial` / `beastversion_package` — reliable (rename + CBAN lookup).
#   See MIGRATION_PLAN.md for the borderline workflow/domain calls flagged for review.
# ---------------------------------------------------------------------------

